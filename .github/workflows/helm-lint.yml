name: helm-lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint and validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint
        run: helm lint ./charts/web-app

      - name: Helm template
        run: helm template release ./charts/web-app --output-dir /tmp/helm-rendered

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Helm template output
        run: kubeconform -strict /tmp/helm-rendered/charts/web-app/templates

      - name: Validate Kustomize build output
        run: kustomize build ./kustomize/overlays/production | kubeconform -strict
