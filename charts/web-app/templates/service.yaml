apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-app
  labels:
    app: web-app
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: web-app
    release: {{ .Release.Name }}
